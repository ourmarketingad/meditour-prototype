<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meditour — 장바구니 (뷰티)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--blue:#3182F6;--blue-bg:#EBF2FF;--ink:#191F28;--gray:#4E5968;--gray2:#8B95A1;--line:#E5E8EB;--bg2:#F9FAFB;--bg3:#F2F4F6;--red:#E5484D;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);background:var(--bg2);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{text-decoration:none;color:inherit;} .muted2{color:var(--gray2);} .muted{color:var(--gray);}
  .top{height:60px;display:flex;align-items:center;gap:12px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);}
  .logo{font-size:18px;font-weight:800;} .top a.back{color:var(--gray);font-size:14px;font-weight:600;margin-left:auto;}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 120px;}
  h1{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-bottom:18px;}
  .group{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;}
  .gh{font-weight:700;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .item{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--bg2);}
  .item .ph{width:64px;height:64px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--gray2);font-size:11px;flex:0 0 auto;}
  .item .nm{font-weight:700;} .item .op{font-size:12px;color:var(--gray2);}
  .qty{display:flex;align-items:center;gap:8px;margin-top:6px;} .qty b{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;}
  .item .pr{margin-left:auto;text-align:right;font-weight:800;} .item .del{color:var(--gray2);font-size:13px;cursor:pointer;margin-top:6px;}
  .sumcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;}
  .line{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;} .line.total{font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:12px;}
  .bar2{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;}
  .bar2 .info{flex:1;} .bar2 .info b{font-size:18px;} .bar2 .info small{display:block;color:var(--gray2);font-size:12px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:700;border-radius:12px;padding:14px 28px;font-size:16px;border:none;cursor:pointer;background:var(--blue);color:#fff;}
</style>
</head>
<body>
  <div class="top"><a class="logo" href="index.html">＋ Meditour</a><a class="back" href="list.html">‹ 쇼핑 계속하기</a></div>
  <div class="wrap">
    <h1>장바구니 <span class="muted2" style="font-size:16px;font-weight:600;">뷰티 상품</span></h1>

    <div class="group">
      <div class="gh">🏪 OOO 에스테틱 · 신사</div>
      <div class="item"><div class="ph">상품</div>
        <div style="flex:1;"><div class="nm">아쿠아필 패키지</div><div class="op">옵션: 1회권</div>
          <div class="qty"><b>−</b><span>1</span><b>+</b></div></div>
        <div><div class="pr">₩120,000</div><div class="del">삭제</div></div></div>
      <div class="item"><div class="ph">상품</div>
        <div style="flex:1;"><div class="nm">LED 스킨케어</div><div class="op">옵션: 3회권</div>
          <div class="qty"><b>−</b><span>1</span><b>+</b></div></div>
        <div><div class="pr">₩90,000</div><div class="del">삭제</div></div></div>
    </div>

    <div class="group">
      <div class="gh">🏪 OOO 더마 · 강남</div>
      <div class="item"><div class="ph">상품</div>
        <div style="flex:1;"><div class="nm">홈케어 앰플 세트</div><div class="op">옵션: 기본</div>
          <div class="qty"><b>−</b><span>2</span><b>+</b></div></div>
        <div><div class="pr">₩60,000</div><div class="del">삭제</div></div></div>
    </div>

    <div class="sumcard">
      <div class="line"><span class="muted">상품 금액</span><span>₩330,000</span></div>
      <div class="line"><span class="muted">할인</span><span style="color:var(--red)">−₩30,000</span></div>
      <div class="line total"><span>결제 예정</span><span>₩300,000</span></div>
    </div>
  </div>

  <div class="bar2"><div class="info"><b>₩300,000</b><small>3개 상품 · 2개 업체</small></div>
    <a class="btn" href="order.html">주문하기</a></div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meditour — 주문 완료</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--blue:#3182F6;--blue-bg:#EBF2FF;--ink:#191F28;--gray:#4E5968;--gray2:#8B95A1;--line:#E5E8EB;--bg2:#F9FAFB;--bg3:#F2F4F6;--green:#15B886;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);background:var(--bg2);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{text-decoration:none;color:inherit;} .muted2{color:var(--gray2);} .muted{color:var(--gray);}
  .top{height:60px;display:flex;align-items:center;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);} .logo{font-size:18px;font-weight:800;}
  .stage{max-width:520px;margin:0 auto;padding:36px 20px 80px;}
  .hero{text-align:center;} .check{width:72px;height:72px;border-radius:50%;background:var(--green);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .hero h1{font-size:26px;font-weight:800;letter-spacing:-.6px;} .hero p{color:var(--gray);margin-top:8px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin:20px 0 16px;} .card h3{font-size:16px;font-weight:800;margin-bottom:12px;}
  .line{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--bg2);} .line:last-child{border-bottom:none;} .line span{color:var(--gray);}
  .vch{background:var(--blue-bg);border-radius:14px;padding:16px;font-size:13px;color:#1b4fb0;} .vch b{display:block;margin-bottom:6px;}
  .btns{display:flex;gap:10px;margin-top:6px;} .btns a{flex:1;text-align:center;font-weight:700;border-radius:12px;padding:15px;font-size:15px;} .btns .p{background:var(--blue);color:#fff;} .btns .g{background:var(--bg3);color:var(--ink);}
</style>
</head>
<body>
  <div class="top"><a class="logo" href="index.html">＋ Meditour</a></div>
  <div class="stage">
    <div class="hero"><div class="check">✓</div><h1>주문이 완료됐어요!</h1><p>바우처가 발급됐어요. 매장 방문 시 사용하세요.</p></div>
    <div class="card"><h3>주문 정보</h3>
      <div class="line"><span>주문번호</span><b>#20260629-0091</b></div>
      <div class="line"><span>상품</span><b>아쿠아필 패키지 외 1건</b></div>
      <div class="line"><span>결제금액</span><b>₩180,000</b></div>
      <div class="line"><span>적립</span><b>+1,800P</b></div>
    </div>
    <div class="card" style="padding:18px;">
      <div class="vch"><b>🎟 바우처 안내</b>마이페이지 → 주문 내역에서 바우처를 확인하고, 예약 방문 시 제시하세요. 홈케어 상품은 배송 조회가 가능합니다.</div>
    </div>
    <div class="btns"><a class="g" href="receipt.html">영수증</a><a class="p" href="orders.html">주문 내역 보기</a></div>
  </div>
</body>
</html>

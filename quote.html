<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meditour — 견적서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--blue:#3182F6;--blue-bg:#EBF2FF;--ink:#191F28;--gray:#4E5968;--gray2:#8B95A1;--line:#E5E8EB;--bg2:#F9FAFB;--bg3:#F2F4F6;--green:#15B886;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);background:var(--bg2);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{text-decoration:none;color:inherit;} .muted2{color:var(--gray2);} .muted{color:var(--gray);}
  .top{height:60px;display:flex;align-items:center;gap:12px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);}
  .logo{font-size:18px;font-weight:800;} .top a.back{color:var(--gray);font-size:14px;font-weight:600;margin-left:auto;}
  .wrap{max-width:600px;margin:0 auto;padding:28px 24px 100px;}
  .doc{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;}
  .dh{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:16px;} .dh .logo2{font-size:20px;font-weight:800;} .dh .qn{margin-left:auto;text-align:right;font-size:12px;color:var(--gray2);}
  h1{font-size:22px;font-weight:800;}
  .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--gray);margin-bottom:18px;}
  table{width:100%;border-collapse:collapse;font-size:14px;} th{text-align:left;color:var(--gray2);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line);} th.r,td.r{text-align:right;} td{padding:12px 8px;border-bottom:1px solid var(--bg2);}
  .sum{margin-top:14px;} .sl{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;} .sl.total{font-size:18px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:12px;}
  .valid{background:#FFF7E6;border-radius:12px;padding:12px 14px;font-size:13px;color:#9A6B00;margin-top:18px;font-weight:600;}
  .bar2{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;} .bar2 .info{flex:1;} .bar2 .info b{font-size:18px;} .bar2 .info small{display:block;color:var(--gray2);font-size:12px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:700;border-radius:12px;padding:14px 24px;font-size:16px;border:none;cursor:pointer;background:var(--blue);color:#fff;} .btn.line{background:#fff;border:1px solid var(--line);color:var(--gray);}
</style>
</head>
<body>
  <div class="top"><a class="logo" href="index.html">＋ Meditour</a><a class="back" href="chat.html">‹ 채팅</a></div>
  <div class="wrap">
    <div class="doc">
      <div class="dh"><span class="logo2">＋ Meditour</span><div class="qn">견적서 No.<br>Q-20260629-018</div></div>
      <h1>리프팅 패키지 견적</h1>
      <div class="meta"><span>OOO 클리닉 · 청담</span><span>발행 2026-06-29</span></div>
      <table>
        <tr><th>항목</th><th class="r">수량</th><th class="r">금액</th></tr>
        <tr><td>리프팅 패키지 (60분)</td><td class="r">1</td><td class="r">₩500,000</td></tr>
        <tr><td>마취 크림 옵션</td><td class="r">1</td><td class="r">₩30,000</td></tr>
        <tr><td>외국인 첫 방문 할인</td><td class="r"></td><td class="r" style="color:#E5484D;">−₩50,000</td></tr>
      </table>
      <div class="sum">
        <div class="sl"><span class="muted">소계</span><span>₩480,000</span></div>
        <div class="sl"><span class="muted">예약금 (10%)</span><span>₩48,000</span></div>
        <div class="sl total"><span>총 견적</span><span>₩480,000</span></div>
      </div>
      <div class="valid">⏳ 이 견적은 2026-07-06까지 유효합니다. 예약금 결제 시 해당 일정·금액으로 예약이 확정됩니다.</div>
    </div>
  </div>
  <div class="bar2"><div class="info"><b>₩48,000</b><small>예약금 결제 시 확정</small></div>
    <a class="btn line" href="chat.html">문의</a><a class="btn" href="booking-pay.html">예약금 결제</a></div>
</body>
</html>

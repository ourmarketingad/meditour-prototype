<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meditour — 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--blue:#3182F6;--blue-d:#1B64DA;--ink:#191F28;--gray:#4E5968;--gray2:#8B95A1;
        --line:#E5E8EB;--bg2:#F9FAFB;--bg3:#F2F4F6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);background:var(--bg2);
       line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
  a{text-decoration:none;color:inherit;}
  .muted{color:var(--gray);} .muted2{color:var(--gray2);}
  .top{height:64px;display:flex;align-items:center;justify-content:center;}
  .logo{font-size:20px;font-weight:800;letter-spacing:-.5px;}
  .stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px 60px;}
  .card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px 32px;}
  h1{font-size:26px;font-weight:800;letter-spacing:-.6px;text-align:center;}
  .sub{text-align:center;color:var(--gray);font-size:14px;margin:8px 0 24px;}
  .tabs{display:flex;background:var(--bg3);border-radius:12px;padding:4px;margin-bottom:24px;}
  .tabs a{flex:1;text-align:center;padding:10px;border-radius:9px;font-size:14px;font-weight:700;color:var(--gray);}
  .tabs a.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .social{display:flex;flex-direction:column;gap:10px;}
  .sbtn{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:12px;
        border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;cursor:pointer;}
  .sbtn.kakao{background:#FEE500;border-color:#FEE500;} .sbtn.line{background:#06C755;border-color:#06C755;color:#fff;}
  .sbtn.wechat{background:#07C160;border-color:#07C160;color:#fff;}
  .divider{display:flex;align-items:center;gap:12px;color:var(--gray2);font-size:12px;margin:22px 0;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .field{width:100%;height:52px;border:1px solid var(--line);border-radius:12px;padding:0 16px;
         font-size:15px;color:var(--gray2);display:flex;align-items:center;margin-bottom:10px;background:#fff;}
  .btn{width:100%;height:52px;border:none;border-radius:12px;background:var(--blue);color:#fff;
       font-size:16px;font-weight:700;cursor:pointer;}
  .btn:hover{background:var(--blue-d);}
  .links{display:flex;justify-content:center;gap:14px;margin-top:18px;font-size:14px;color:var(--gray);}
  .links a:hover{color:var(--ink);}
  .foot{text-align:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--gray);}
  .foot a{color:var(--blue);font-weight:700;}
  .admin{text-align:center;margin-top:14px;font-size:12px;}
  .admin a{color:var(--gray2);text-decoration:underline;}
</style>
</head>
<body>
  <div class="top"><a class="logo" href="index.html">＋ Meditour</a></div>
  <div class="stage">
    <div class="card">
      <h1>로그인</h1>
      <p class="sub">검색·상담·예약을 한 번에</p>

      <div class="tabs"><a class="on">일반 회원</a><a href="biz-dashboard.html">업체(파트너)</a></div>

      <div class="social">
        <div class="sbtn"> G  Google로 계속하기</div>
        <div class="sbtn"> ⌘  Apple로 계속하기</div>
        <div class="sbtn wechat"> 微  WeChat으로 계속하기</div>
        <div class="sbtn line"> L  LINE으로 계속하기</div>
        <div class="sbtn kakao"> K  카카오로 계속하기</div>
      </div>

      <div class="divider">또는 이메일로 로그인</div>

      <div class="field">이메일</div>
      <div class="field">비밀번호</div>
      <button class="btn" onclick="location.href='mypage.html'">로그인</button>

      <div class="links"><a href="signup.html">회원가입</a><span class="muted2">·</span><a>비밀번호 찾기</a></div>

      <div class="foot">업체이신가요? <a href="partner.html">파트너 입점 신청 →</a></div>
      <div class="admin"><a href="admin-dashboard.html">관리자 로그인</a></div>
    </div>
  </div>
</body>
</html>

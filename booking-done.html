<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meditour — 예약 완료</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--blue:#3182F6;--blue-d:#1B64DA;--blue-bg:#EBF2FF;--ink:#191F28;--gray:#4E5968;--gray2:#8B95A1;--line:#E5E8EB;--bg2:#F9FAFB;--bg3:#F2F4F6;--green:#15B886;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);background:var(--bg2);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;}
  a{text-decoration:none;color:inherit;} .muted2{color:var(--gray2);} .muted{color:var(--gray);}
  .top{height:60px;display:flex;align-items:center;gap:12px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);}
  .top .logo{font-size:18px;font-weight:800;}
  .stage{max-width:520px;margin:0 auto;padding:30px 20px 80px;}
  .steps{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px;}
  .stp{display:flex;align-items:center;gap:8px;} .stp .c{width:26px;height:26px;border-radius:50%;background:var(--bg3);color:var(--gray2);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .stp.done .c{background:var(--ink);color:#fff;} .stp.on .c{background:var(--green);color:#fff;}
  .stp .l{font-size:13px;font-weight:700;color:var(--gray2);} .stp.done .l,.stp.on .l{color:var(--ink);} .stp .bar{width:24px;height:2px;background:var(--line);}
  .hero{text-align:center;padding:20px 0 8px;}
  .check{width:72px;height:72px;border-radius:50%;background:var(--green);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .hero h1{font-size:26px;font-weight:800;letter-spacing:-.6px;} .hero p{color:var(--gray);margin-top:8px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin:20px 0 16px;}
  .card h3{font-size:16px;font-weight:800;margin-bottom:12px;}
  .line{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--bg2);} .line:last-child{border-bottom:none;} .line span{color:var(--gray);}
  .remind{background:var(--blue-bg);border-radius:14px;padding:16px;font-size:13px;color:#1b4fb0;}
  .remind b{display:block;margin-bottom:6px;}
  .remind .r{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;} .remind .r span{background:#fff;border-radius:8px;padding:4px 10px;font-weight:700;}
  .btns{display:flex;gap:10px;margin-top:6px;} .btns a{flex:1;text-align:center;font-weight:700;border-radius:12px;padding:15px;font-size:15px;}
  .btns .p{background:var(--blue);color:#fff;} .btns .g{background:var(--bg3);color:var(--ink);}
</style>
</head>
<body>
  <div class="top"><a class="logo" href="index.html">＋ Meditour</a></div>
  <div class="stage">
    <div class="steps">
      <div class="stp done"><div class="c">✓</div><div class="l">선택</div></div><div class="bar"></div>
      <div class="stp done"><div class="c">✓</div><div class="l">인증</div></div><div class="bar"></div>
      <div class="stp done"><div class="c">✓</div><div class="l">결제</div></div><div class="bar"></div>
      <div class="stp on"><div class="c">✓</div><div class="l">완료</div></div>
    </div>

    <div class="hero">
      <div class="check">✓</div>
      <h1>예약이 확정됐어요!</h1>
      <p>확인 알림을 보내드렸어요. 업체에도 예약이 전달됐습니다.</p>
    </div>

    <div class="card"><h3>예약 정보</h3>
      <div class="line"><span>예약번호</span><b>#20260710-0142</b></div>
      <div class="line"><span>업체</span><b>OOO 클리닉 · 청담</b></div>
      <div class="line"><span>시술</span><b>리프팅 패키지</b></div>
      <div class="line"><span>일시</span><b>2026-07-10(목) 14:00</b></div>
      <div class="line"><span>예약금</span><b>₩50,000 결제완료</b></div>
      <div class="line"><span>잔금</span><b>₩450,000 (현장)</b></div>
    </div>

    <div class="card" style="padding:18px;">
      <div class="remind"><b>🔔 노쇼 방지 리마인드</b>
        방문 전 자동으로 알려드려요. 못 가게 되면 <b>24시간 전까지</b> 무료로 변경·취소하세요.
        <div class="r"><span>D-3 알림</span><span>D-1 알림</span><span>당일 AI 전화</span></div>
      </div>
    </div>

    <div class="btns">
      <a class="g" href="chat.html">💬 업체에 문의</a>
      <a class="p" href="mypage.html">예약 내역 보기</a>
    </div>
  </div>
</body>
</html>

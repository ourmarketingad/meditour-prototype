<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meditour — 회원가입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--blue:#3182F6;--blue-d:#1B64DA;--ink:#191F28;--gray:#4E5968;--gray2:#8B95A1;
        --line:#E5E8EB;--bg2:#F9FAFB;--bg3:#F2F4F6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);background:var(--bg2);
       line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
  a{text-decoration:none;color:inherit;} .muted2{color:var(--gray2);}
  .top{height:64px;display:flex;align-items:center;justify-content:center;}
  .logo{font-size:20px;font-weight:800;letter-spacing:-.5px;}
  .stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:30px 20px 60px;}
  .card{width:100%;max-width:460px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 32px;}
  h1{font-size:26px;font-weight:800;letter-spacing:-.6px;}
  .sub{color:var(--gray);font-size:14px;margin:8px 0 22px;}
  /* steps */
  .steps{display:flex;gap:8px;margin-bottom:26px;}
  .st{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--gray2);}
  .st .dot{height:6px;border-radius:3px;background:var(--bg3);margin-bottom:8px;}
  .st.on{color:var(--blue);} .st.on .dot{background:var(--blue);}
  .st.done{color:var(--ink);} .st.done .dot{background:var(--ink);}
  label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px;}
  .field{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;
         font-size:14px;color:var(--gray2);display:flex;align-items:center;background:#fff;}
  .row{display:flex;gap:8px;}
  .minibtn{flex:0 0 auto;padding:0 16px;height:50px;border:1px solid var(--blue);color:var(--blue);
           background:#fff;border-radius:12px;font-size:13px;font-weight:700;display:flex;align-items:center;cursor:pointer;}
  .hint{font-size:12px;color:var(--gray2);margin-top:6px;}
  .checks{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;}
  .ck{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--gray);margin-bottom:10px;}
  .ck input{accent-color:var(--blue);width:18px;height:18px;} .ck.all{font-weight:700;color:var(--ink);}
  .ck a{color:var(--gray2);text-decoration:underline;margin-left:auto;font-size:12px;}
  .btn{width:100%;height:52px;border:none;border-radius:12px;background:var(--blue);color:#fff;
       font-size:16px;font-weight:700;cursor:pointer;margin-top:22px;}
  .foot{text-align:center;margin-top:18px;font-size:14px;color:var(--gray);}
  .foot a{color:var(--blue);font-weight:700;}

/* QA: 모바일에서 헤더 버튼이 화면 밖으로 밀려 가로 스크롤 생기는 문제 수정 */
@media (max-width:640px){ .nav{flex-wrap:wrap;height:auto;min-height:56px;padding:8px 16px;gap:10px 14px} }
</style>
</head>
<body>
  <div class="top"><a class="logo" href="index.html">＋ Meditour</a></div>
  <div class="stage">
    <div class="card">
      <h1>회원가입</h1>
      <p class="sub">외국인 환자도 안심하고 가입할 수 있어요</p>

      <!-- 소셜 원클릭 가입 (휴대폰 인증 없음) -->
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">
        <div class="field" style="justify-content:center;height:52px;font-weight:600;color:var(--ink);"> G &nbsp; Google로 1초 가입</div>
        <div class="field" style="justify-content:center;height:52px;font-weight:600;color:var(--ink);"> ⌘ &nbsp; Apple로 가입</div>
      </div>
      <div class="hint" style="text-align:center;background:#EBF2FF;color:#1b4fb0;border-radius:10px;padding:10px;margin-bottom:16px;">📱 휴대폰 인증은 가입 때가 아니라 <b>예약할 때 한 번만</b> 진행돼요 (노쇼 방지·연락용)</div>

      <div style="display:flex;align-items:center;gap:12px;color:var(--gray2);font-size:12px;margin:6px 0 14px;"><span style="flex:1;height:1px;background:var(--line);"></span>또는 이메일로<span style="flex:1;height:1px;background:var(--line);"></span></div>

      <label>이메일</label>
      <div class="row"><div class="field" style="flex:1;">email@example.com</div><div class="minibtn">인증</div></div>
      <label>비밀번호</label>
      <div class="field">8자 이상, 영문·숫자 조합</div>
      <label>이름 · 국가</label>
      <div class="row"><div class="field" style="flex:1;">이름</div><div class="field" style="flex:1;">🌐 국가 선택</div></div>

      <div class="checks">
        <label class="ck all"><input type="checkbox"> 전체 동의</label>
        <label class="ck"><input type="checkbox"> [필수] 이용약관 동의 <a>보기</a></label>
        <label class="ck"><input type="checkbox"> [필수] 개인정보 수집·이용 동의 <a>보기</a></label>
        <label class="ck"><input type="checkbox"> [선택] 마케팅 정보 수신 동의 <a>보기</a></label>
      </div>

      <button class="btn">가입하기</button>
      <div class="foot">이미 계정이 있으신가요? <a href="login.html">로그인</a></div>
    </div>
  </div>
</body>
</html>
